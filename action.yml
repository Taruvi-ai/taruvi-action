name: 'Taruvi Deploy'
description: 'Deploy frontend and backend to Taruvi BaaS platform'
author: 'Taruvi'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  site-url:
    description: 'Taruvi site URL (e.g., https://api.taruvi.cloud/sites/my-site)'
    required: true
  api-key:
    description: 'Taruvi API key'
    required: true
  app-slug:
    description: 'App slug for deployment'
    required: true
  frontend-zip-path:
    description: 'Path to frontend build zip file. Skip frontend deploy if not provided.'
    required: false
    default: ''
  backend-dir:
    description: 'Path to backend config directory'
    required: false
    default: '.taruvi-backend'
  skip-frontend:
    description: 'Skip frontend deployment'
    required: false
    default: 'false'
  skip-backend:
    description: 'Skip backend import'
    required: false
    default: 'false'
  branch-name:
    description: 'Branch name for subdomain suffix (used when creating new workers)'
    required: false
    default: ''

outputs:
  worker-slug:
    description: 'Deployed frontend worker slug'
    value: ${{ steps.frontend.outputs.worker_slug }}
  deploy-type:
    description: 'Deploy type (update/create/skipped)'
    value: ${{ steps.frontend.outputs.deploy_type }}
  frontend-url:
    description: 'Frontend worker URL'
    value: ${{ steps.frontend.outputs.frontend_url }}
  backend-imported:
    description: 'Whether backend was imported (true/false/skipped)'
    value: ${{ steps.backend.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Deploy Frontend
      id: frontend
      shell: bash
      run: ${{ github.action_path }}/scripts/deploy-frontend.sh
      env:
        INPUT_SITE_URL: ${{ inputs.site-url }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_APP_SLUG: ${{ inputs.app-slug }}
        INPUT_FRONTEND_ZIP: ${{ inputs.frontend-zip-path }}
        INPUT_BRANCH_NAME: ${{ inputs.branch-name }}
        INPUT_SKIP_FRONTEND: ${{ inputs.skip-frontend }}

    - name: Import Backend
      id: backend
      shell: bash
      run: ${{ github.action_path }}/scripts/import-backend.sh
      env:
        INPUT_SITE_URL: ${{ inputs.site-url }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_BACKEND_DIR: ${{ inputs.backend-dir }}
        INPUT_SKIP_BACKEND: ${{ inputs.skip-backend }}
